<!doctype html>
<html lang="ru" class="i18n-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="ui.app.title"></title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/common.js"></script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path class="bubble" d="M7 5h18a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H15l-6 5v-5H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/><path d="M10 11h12M10 16h8"/></svg>
      <div>
        <h1 data-i18n="ui.app.title"></h1>
        <p class="tagline" data-i18n="ui.app.tagline"></p>
      </div>
    </div>
    <div class="controls" id="controls"></div>
  </header>
  <div class="status" id="status" aria-live="polite"><span class="pill" data-i18n="ui.status.loading"></span></div>
  <div class="banner" id="banner" hidden></div>

  <main class="layout">
    <section class="card area-kb" aria-labelledby="kbHeading">
      <div class="card-head"><h2 id="kbHeading" data-i18n="ui.kb.heading"></h2></div>
      <div class="kb-body">
        <div>
          <label class="drop" id="drop">
            <input type="file" id="file" accept=".txt,.pdf" multiple>
            <span data-i18n="ui.kb.drop"></span>
            <span class="limit" data-i18n="ui.kb.types"></span>
          </label>
          <div id="uploadMsg" aria-live="polite"></div>
        </div>
        <ul class="docs" id="docs"></ul>
      </div>
    </section>

    <section class="card area-tickets" id="tickets" aria-labelledby="ticketsHeading">
      <div class="card-head">
        <h2 id="ticketsHeading" data-i18n="ui.tickets.heading"></h2>
        <button class="ghost" id="refreshTickets" type="button" data-i18n="ui.tickets.refresh"></button>
      </div>
      <details class="new-ticket" id="newTicket">
        <summary data-i18n="ui.tickets.new"></summary>
        <form id="ticketForm" novalidate>
          <label class="field">
            <span class="field-label" data-i18n="ui.tickets.name"></span>
            <input id="tName" name="customer_name" maxlength="200" autocomplete="off" data-i18n-placeholder="ui.tickets.name_placeholder">
          </label>
          <label class="field">
            <span class="field-label" data-i18n="ui.tickets.email"></span>
            <input id="tEmail" name="customer_email" type="email" maxlength="320" autocomplete="off" data-i18n-placeholder="ui.tickets.email_placeholder">
          </label>
          <label class="field">
            <span class="field-label" data-i18n="ui.tickets.question"></span>
            <textarea id="tQuestion" name="question" maxlength="5000" rows="3" data-i18n-placeholder="ui.tickets.question_placeholder"></textarea>
          </label>
          <div class="form-actions">
            <button class="primary" id="createTicket" type="submit" data-i18n="ui.tickets.create"></button>
          </div>
          <div id="ticketFormMsg" aria-live="polite"></div>
        </form>
      </details>
      <div class="filters" id="filters" role="group" data-i18n-aria-label="ui.tickets.filter_label"></div>
      <div id="ticketsMsg" aria-live="polite"></div>
      <ul class="ticket-list" id="ticketList"></ul>
    </section>

    <section class="card area-ticket" id="ticket" aria-labelledby="ticketHeading">
      <div class="card-head"><h2 id="ticketHeading" data-i18n="ui.ticket.heading"></h2></div>
      <div id="ticketBody"><p class="placeholder" data-i18n="ui.ticket.none"></p></div>
    </section>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
