[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-copilot"
version = "0.1.0"
description = "AI Customer Support Copilot: ticket drafting on top of the document_search RAG service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The RAG engine; install it first: pip install -e ../python_in30days
    "inteligent-document-searcher",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["venv"]
